{% extends "base.html" %}

{% block title %}Welcome: AI Tutor{% endblock %}

{% block content %}
    <br>
    <br>
    <div id="chat-bot">
        <h2>Lets start chating it up.</h2>
        {% for user, message in current_chat %}
            <p>{{ user }}: {{ message }}</p>
        {% endfor %}
    </div>

    <form id="message-form" action="/send/{{chat_id}}" method="POST">
        <textarea id="message-input" name="message" rows="8" placeholder="Type a message..."></textarea>
    </form>
        <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
