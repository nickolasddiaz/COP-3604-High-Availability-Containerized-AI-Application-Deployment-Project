# Define database service
services:
  database:
    image: postgres:19rc2 # Use a modern postgres version
    container_name: rag-database
    volumes:
      - rag_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=rag-db
    ports:
      - '5432:5432' # Expose port 5432 as it is the default for PostgreSQL
    develop:
      watch:
        - action: rebuild
          path: requirements.txt # Rebuild if requirements.txt changes

volumes:
  rag_data: