# Define database service
services:
  database:
    image: pgvector/pgvector:pg19-trixie # pinned PostgreSQL DB with pgvector
    container_name: rag-database
    restart: unless-stopped
    volumes:
      - rag_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/New_York
    ports:
      - '${DB_PORT}:5432' # maps DB_PORT to the host machine to port 5432 inside the Docker container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    # develop:
    #   watch:
    #     - action: rebuild
    #       path: requirements.txt # Rebuild if requirements.txt changes
volumes:
  rag_data: