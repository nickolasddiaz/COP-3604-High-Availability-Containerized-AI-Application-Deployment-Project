[project]
name = "cop-3604-ai-tutor"
version = "1.0.0"
description = "An AI-powered interactive tutor and adaptive assessment bot."
readme = "README.md"
requires-python = "==3.13.18"
dependencies = [
    "Flask==3.1.3",
    "flasgger==0.9.7.1",
    "python-dotenv==1.2.4",
    "python-dotenv",
    "langchain==1.5.0",
    "langchain-openai==1.8.1",
    "langchain-openrouter==0.2.9",
    "langchain-postgres==0.0.19",
    "langchain-ollama==1.2.0",
    "pypdf==7.1.1",
    "langchain-community==0.4.2",
    "gunicorn==27.0.1; sys_platform == 'linux'",
    
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]