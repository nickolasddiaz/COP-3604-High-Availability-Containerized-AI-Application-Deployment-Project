proxy_cache_path /tmp/cache levels=1:2 keys_zone=cache:10m max_size=500m inactive=60m use_temp_path=off;

server {
  listen 80;

    # Allow file uploads up to 25MB (default is 1MB, which blocks uploaded_files)
    client_max_body_size 25M;

    # Increase timeouts so LLM/embedding processing doesn't trigger a 504 Gateway Timeout
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

  location / {
    proxy_pass http://$FLASK_SERVER_ADDR;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 "success";
  }
  
}