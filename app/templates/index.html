{% extends "base.html" %}

{% block title %}Welcome: AI Tutor{% endblock %}

{% block content %}
    <br>
    <br>
    <div id="chat-bot">
        <h2>Lets start chating it up.</h2>
        {% for chat in current_chat %}
            <div>
                <p><b style="display: inline;">{{ chat.role | capitalize }}: </b>{{", ".join(chat.files)}}</p>
                <p>{{ chat.content }}</p>
            </div>
        {% endfor %}
    </div>

    <form id="message-form" action="/send/{{chat_id}}" method="POST" enctype="multipart/form-data">
        <ul id="file-list">

        </ul>
        <input type="file" id="attachments" name="uploaded_files" multiple hidden>
        <textarea id="message-input" name="message" rows="8" placeholder="Type a message..."></textarea>
    </form>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
